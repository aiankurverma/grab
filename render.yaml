services:
  # Next.js Web Frontend & API
  - type: web
    name: grabwave-web
    env: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter web build
    startCommand: pnpm --filter web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: grabwave-postgres
          property: connectionString
      - key: WORKER_URL
        fromService:
          type: web
          name: grabwave-worker
          property: host
      - key: INTERNAL_API_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_SECRET_SHA256
        value: 104f5165807ebdd54a3b1146eddc5224c55094948e90197b4b942736449b5f06
      - key: CLOUDINARY_CLOUD_NAME
        value: yt6oi9ll
      - key: CLOUDINARY_API_KEY
        value: "772144696673483"
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: AI_ENRICHMENT_ENABLED
        value: "true"
      - key: INCEPTION_API_KEY
        sync: false
      - key: MERCURY_BASE_URL
        value: https://api.inceptionlabs.ai/v1
      - key: MERCURY_MODEL
        value: mercury-3

  # FastAPI Worker & yt-dlp / ffmpeg Engine
  - type: web
    name: grabwave-worker
    env: docker
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: ./apps/worker
    plan: standard
    envVars:
      - key: WORKER_HOST
        value: 0.0.0.0
      - key: WORKER_PORT
        value: 8000
      - key: INLINE_JOBS
        value: "true"
      - key: WEB_INTERNAL_URL
        fromService:
          type: web
          name: grabwave-web
          property: host
      - key: INTERNAL_API_SECRET
        fromService:
          type: web
          name: grabwave-web
          envVarKey: INTERNAL_API_SECRET
      - key: AI_ENRICHMENT_ENABLED
        value: "true"
      - key: INCEPTION_API_KEY
        fromService:
          type: web
          name: grabwave-web
          envVarKey: INCEPTION_API_KEY
      - key: MERCURY_BASE_URL
        value: https://api.inceptionlabs.ai/v1
      - key: MERCURY_MODEL
        value: mercury-3

databases:
  - name: grabwave-postgres
    plan: free
    databaseName: grabwave
    user: grabwave
